# =============================================================================
#  CI Pipeline - AWR2944 mmWave Radar Safety Firmware
#  ISO 26262 ASIL-D / IEC 61508 SIL-3
# =============================================================================
name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  TI_CGT_VERSION: "20.2.7.LTS"
  BUILD_TYPE: Release

jobs:
  # ---------------------------------------------------------------------------
  #  Static Analysis (MISRA-C:2012)
  # ---------------------------------------------------------------------------
  static-analysis:
    name: MISRA-C Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck

      - name: Run cppcheck (MISRA subset)
        run: |
          cppcheck --enable=all --std=c99 \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            -I include/ \
            -DAWR2944 -DASIL_D \
            --xml --xml-version=2 \
            src/ 2> cppcheck-report.xml

      - name: Upload static analysis report
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: cppcheck-report.xml

  # ---------------------------------------------------------------------------
  #  Host-Emulation Build (x86_64, for unit tests)
  # ---------------------------------------------------------------------------
  build-host:
    name: Build (Host Emulation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ cmake make

      - name: Configure (CMake)
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Debug \
            -DHOST_EMULATION=ON \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-host
          path: build/

  # ---------------------------------------------------------------------------
  #  Unit Tests
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    needs: build-host
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-host
          path: build/

      - name: Run unit tests
        run: |
          chmod +x build/tests/unit/* || true
          cd build
          ctest --test-dir . --output-on-failure -L unit

      - name: Generate coverage report
        run: |
          sudo apt-get install -y lcov
          lcov --capture --directory build/ --output-file coverage.info \
            --ignore-errors mismatch
          lcov --remove coverage.info '/usr/*' --output-file coverage.info
          lcov --list coverage.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.info

  # ---------------------------------------------------------------------------
  #  Integration Tests
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration Tests
    needs: build-host
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-host
          path: build/

      - name: Run integration tests
        run: |
          chmod +x build/tests/integration/* || true
          cd build
          ctest --test-dir . --output-on-failure -L integration

  # ---------------------------------------------------------------------------
  #  Cross-Compile for ARM R5F (TI CGT)
  # ---------------------------------------------------------------------------
  build-target:
    name: Build (ARM R5F Target)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM GCC (stand-in for TI CGT in CI)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Build with Makefile
        run: |
          make CROSS_COMPILE=arm-none-eabi- all || echo "::warning::Target build requires TI CGT; ARM GCC used as syntax check"

      - name: Check binary size
        run: |
          if [ -f firmware.elf ]; then
            arm-none-eabi-size firmware.elf
          fi

  # ---------------------------------------------------------------------------
  #  Safety Documentation Check
  # ---------------------------------------------------------------------------
  docs-check:
    name: Safety Docs Completeness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required safety documents exist
        run: |
          REQUIRED_DOCS=(
            "safety_docs/FMEA_analysis.md"
            "safety_docs/FTA_analysis.md"
            "safety_docs/DFA_analysis.md"
            "safety_docs/safety_manual.md"
            "safety_docs/sw_development_lifecycle.md"
          )
          MISSING=0
          for doc in "${REQUIRED_DOCS[@]}"; do
            if [ ! -f "$doc" ]; then
              echo "::error::Missing safety document: $doc"
              MISSING=1
            else
              echo "Found: $doc"
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            exit 1
          fi
          echo "All required safety documents present."

      - name: Check document minimum lengths
        run: |
          for doc in safety_docs/*.md; do
            LINES=$(wc -l < "$doc")
            if [ "$LINES" -lt 30 ]; then
              echo "::warning::$doc has only $LINES lines (minimum recommended: 30)"
            else
              echo "$doc: $LINES lines (OK)"
            fi
          done

  # ---------------------------------------------------------------------------
  #  Full CI Summary
  # ---------------------------------------------------------------------------
  ci-summary:
    name: CI Summary
    needs: [static-analysis, unit-tests, integration-tests, build-target, docs-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report CI status
        run: |
          echo "====================================="
          echo "  AWR2944 Safety Firmware CI Summary"
          echo "====================================="
          echo "Static Analysis: ${{ needs.static-analysis.result }}"
          echo "Unit Tests:      ${{ needs.unit-tests.result }}"
          echo "Integration:     ${{ needs.integration-tests.result }}"
          echo "Target Build:    ${{ needs.build-target.result }}"
          echo "Docs Check:      ${{ needs.docs-check.result }}"
          echo "====================================="
          if [[ "${{ needs.static-analysis.result }}" == "failure" ]] || \
             [[ "${{ needs.unit-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.integration-tests.result }}" == "failure" ]]; then
            echo "::error::One or more critical CI stages failed."
            exit 1
          fi
